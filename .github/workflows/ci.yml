name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      # The test-db guard (scripts/testDbGuard.ts) requires .env.test pointing
      # at database "smartprint_test" on localhost:5432. Throwaway CI values.
      - name: Create .env.test
        run: |
          cat > .env.test <<'ENV'
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/smartprint_test"
          JWT_SECRET=ci-test-secret
          JWT_EXPIRES_IN=1d
          ALLOWED_STUDENT_EMAIL_DOMAIN=thapar.edu
          ENV
      - run: npm run test:db:migrate
      - run: npm test

  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    name: Docker (production images)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - name: Check compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml --env-file .env.production.example config -q
      - name: Build backend production image
        run: docker build -f backend/Dockerfile.prod -t smartprint-backend backend
      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile.prod -t smartprint-frontend frontend
      # Starts the frontend image alone (with a stand-in backend address) and
      # checks nginx serves the app and sends unknown paths to index.html.
      - name: Smoke-test frontend image
        run: |
          docker run -d --name fe -p 8080:80 -e BACKEND_URL=http://127.0.0.1:9 smartprint-frontend
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/orders/some-id | grep -q '<div id="root">'
          docker logs fe
