server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's default upload limit (MAX_FILE_SIZE_MB=25) with
    # some room for the multipart wrapper.
    client_max_body_size 30m;

    # API calls go to the backend container. The path is kept as-is
    # (/api/... on both sides), exactly like the Vite proxy in development.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS/CSS file names contain a content hash, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is a React route: serve index.html and let the router handle it.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
