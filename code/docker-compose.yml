services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartprint
      POSTGRES_PASSWORD: smartprint
      POSTGRES_DB: smartprint
    ports:
      # Host port 5433 (not 5432) -- avoids colliding with a native
      # PostgreSQL service that may already be running on the host.
      - "5433:5432"
    volumes:
      - smartprint_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartprint"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      # Optional: a fresh clone still starts without it (the values below are
      # enough). Copy backend/.env.example to backend/.env to change anything.
      - path: ./backend/.env
        required: false
    environment:
      # Fixed here so a different PORT in your own .env cannot break the
      # 4000:4000 mapping below.
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      DATABASE_URL: postgresql://smartprint:smartprint@db:5432/smartprint?schema=public
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # The browser calls /api on the frontend; Vite forwards it to the backend container.
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:4000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  smartprint_db_data:
  backend_node_modules:
  backend_uploads:
  frontend_node_modules:
